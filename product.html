<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product</title>

    <link rel="stylesheet" href="product.css">
</head>

<body>

    <!-- Header -->
    <header>
        <nav>

            <div class="left">
                <a href="index.html">Featured</a>
                <a href="">Women</a>
                <a href="">Men</a>
            </div>

            <div class="center">
                <a href="index.html">
                    <img src="logo18.png" alt="One8 Logo" class="logo">
                </a>
            </div>

            <div class="right">
                <a href="">Search</a>
                <a href="">Cart</a>
                <a href="">Contact</a>
            </div>

        </nav>
    </header>

    <div class="product-container">

        <!-- Product Images -->
  <div class="product-image">

    <div class="image-card">
        <img id="product-image-1" src="" alt="">
    </div>

    <div class="image-card">
        <img id="product-image-2" src="" alt="">
    </div>

</div>

        <!-- Product Details -->
        <div class="product-details">

            <h1 id="product-name"></h1>

            <h2 id="product-price"></h2>

            <p id="product-rating"></p>

            <p id="product-description"></p>

            <h3>Available Sizes</h3>

            <div id="size-container"></div>

            <button class="cart-btn">Add to Cart</button>

        </div>

    </div>

    <script src="product.js"></script>

</body>

</html>
