<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product | One8</title>

    <link rel="stylesheet" href="../css/product.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- Header -->
    <header>
        <nav>

            <!-- Left Navigation -->
            <div class="left">
                <a href="../index.html">Featured</a>
                <a href="">Women</a>
                <a href="">Men</a>
            </div>

            <!-- Center Logo -->
            <div class="center">
                <a href="../index.html">
                    <img
                        src="../assets/logos/one8.png"
                        alt="One8 Logo"
                        class="logo"
                    >
                </a>
            </div>

            <!-- Right Navigation -->
            <div class="right">
                <a href="">Search</a>
                <a href="">Cart</a>
                <a href="">Contact</a>
            </div>

        </nav>
    </header>


    <!-- Product Section -->
    <main class="product-container">

        <!-- Product Image 1 -->
        <div class="image-card">
            <img
                id="product-image-1"
                src=""
                alt="Product Image"
            >
        </div>


        <!-- Product Image 2 -->
        <div class="image-card">
            <img
                id="product-image-2"
                src=""
                alt="Product Image"
            >
        </div>


        <!-- Product Details -->
        <div class="product-details">

            <h1 id="product-name"></h1>

            <h2 id="product-price"></h2>

            <p id="product-rating"></p>

            <p id="product-description"></p>


            <!-- Sizes -->
            <h3>Available Sizes</h3>

            <div id="size-container"></div>


            <!-- Cart -->
            <button class="cart-btn">
                Add to Cart
            </button>

        </div>

    </main>


    <!-- Product JavaScript -->
    <script src="../js/product.js"></script>

</body>

</html>
