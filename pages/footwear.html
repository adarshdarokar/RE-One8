<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear | One8</title>

    <link rel="stylesheet" href="../css/footwear.css">
</head>

<body>

    <header>

        <nav>

            <div class="left">
                <a href="#">Featured</a>
                <a href="#">Women</a>
                <a href="#">Men</a>
            </div>

            <div class="center">
                <a href="../index.html">
                    <img src="../assets/logos/one8.png" alt="One8 Logo" class="logo">
                </a>
            </div>

            <div class="right">

                <div class="search-box">
                    <img src="../assets/logos/search-icon.svg" alt="Search" class="search-icon">
                    <input type="text" placeholder="Search for products">
                </div>

                <div class="nav-icons">
                    <img src="../assets/logos/whishlist-icon.svg" alt="" class="nav-icon">
                    <img src="../assets/logos/user-round.svg" alt="" class="nav-icon">
                    <img src="../assets/logos/shopping-bag.svg" alt="" class="nav-icon">
                </div>

            </div>

        </nav>

    </header>

    <main class="footwear-page">

        <aside class="sidebar">

            <div class="sidebar-header">

                <div class="title-row">
                    <h1>Footwear - All</h1>
                    <p>30 Products</p>
                </div>

            </div>

            <div class="filters">

                <div class="filter-item">
                    <span>PRICE</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

                <div class="filter-item">
                    <span>GENDER</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

                <div class="filter-item">
                    <span>PRODUCT TYPE</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

                <div class="filter-item">
                    <span>SIZE</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

                <div class="filter-item">
                    <span>CATEGORY</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

                <div class="filter-item">
                    <span>COLOR</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

                <div class="filter-item">
                    <span>ACTIVITY</span>
                    <img src="../assets/logos/drop-down.svg" alt="Dropdown">
                </div>

            </div>

        </aside>

        <section class="products">

            <div class="products-header">

                <div class="sort">
                </div>

            </div>

            <!-- JS yaha product cards add karega -->
            <div class="product-grid"></div>
            <div class="pagination">

                <button class="page-btn prev">Previous</button>

                <div class="page-numbers">
                    <button class="page-number active">1</button>
                    <button class="page-number">2</button>
                    <button class="page-number">3</button>
                </div>

                <button class="page-btn next">Next</button>

            </div>

        </section>

    </main>
    <footer class="footer">

    <div class="footer-top">

      <p>© one8 2026</p>

      <div class="payment-icons">

        <img src="../assets/docsimgs/dinersclub.png" alt="">
        <img src="../assets/docsimgs/amex.png" alt="">
        <img src="../assets/docsimgs/express.jpg" alt="">
        <img src="../assets/docsimgs/master-card.jpg" alt="">
        <img src="../assets/docsimgs/mastero.png" alt="">
        <img src="../assets/docsimgs/rupay-card.jpg" alt="">
        <img src="../assets/docsimgs/visa.jpg" alt="">
      </div>

    </div>

    <div class="footer-bg-text">
      one8
    </div>

  </footer>

    <script src="../js/footwear.js"></script>


</body>

</html>
